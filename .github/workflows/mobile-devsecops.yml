name: Mobile DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  sast-analysis:
    name: SAST Analysis
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Semgrep
        run: pip install semgrep
      - name: Create reports folder
        run: mkdir -p security-reports
      - name: Run Semgrep
        run: |
          semgrep --config=p/java \
                  --json \
                  --output=security-reports/semgrep-results.json \
                  app/ || true
      - name: Upload SAST results
        uses: actions/upload-artifact@v4
        with:
          name: sast-results
          path: security-reports/semgrep-results.json

  ai-triage:
    name: AI Vulnerability Triage
    runs-on: ubuntu-latest
    needs: sast-analysis
    steps:
      - uses: actions/checkout@v4
      - name: Download SAST results
        uses: actions/download-artifact@v4
        with:
          name: sast-results
          path: security-reports/
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install anthropic
      - name: Create MobSF demo report
        run: |
          echo '{"high":{"android_debuggable":{"description":"App is debuggable","files":["AndroidManifest.xml"],"cwe":"CWE-489"}},"warning":{"android_allowbackup":{"description":"allowBackup enabled","files":["AndroidManifest.xml"],"cwe":"CWE-530"}},"info":{}}' > security-reports/mobsf-results.json
      - name: Run AI Triage
        run: python3 scripts/ai_triage.py
      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: final-security-report
          path: security-reports/final-report.html